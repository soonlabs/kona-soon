[package]
name = "soon-derive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
alloy-eips = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
alloy-rlp = { workspace = true, features = ["derive"] }
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-primitives = { workspace = true, features = ["rlp", "k256", "map"] }

# Op Alloy
op-alloy-consensus = { workspace = true }
op-alloy-rpc-types-engine = { workspace = true }

# soon
soon-primitives = { workspace = true }

#solana
solana-transaction-status = { workspace = true }
solana-sdk = { workspace = true }

# General
thiserror = { workspace = true }
brotli = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
alloc-no-stdlib = { workspace = true }
bincode = { workspace = true }
soon-miniz-oxide = { workspace = true }
unsigned-varint = { workspace = true }

# `serde` feature dependencies
serde = { workspace = true, optional = true, features = ["derive"] }

# `test-utils` feature dependencies
spin = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["fmt"] }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }

[features]
default = []
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "op-alloy-rpc-types-engine/serde",
]
test-utils = [
    "dep:spin",
    "dep:tracing-subscriber",
]